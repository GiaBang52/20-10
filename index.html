<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> For Bônggg 💫</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    height: 100vh;
    overflow: hidden;
    font-family: "Poppins", sans-serif;
    color: white;
    background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }

  /* Nền sao */
  .stars {
    width: 2px;
    height: 2px;
    background: transparent;
    box-shadow: 
      100px 200px #fff, 400px 50px #fff, 300px 400px #fff,
      700px 150px #fff, 600px 250px #fff, 200px 500px #fff;
    animation: animStar 100s linear infinite;
  }
  @keyframes animStar {
    from {transform: translateY(0px);}
    to {transform: translateY(-2000px);}
  }

  /* Hoa hồng */
  .flower {
    width: 120px;
    cursor: pointer;
    transition: transform 0.5s;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-10px) rotate(3deg); }
  }
  .flower:hover {
    transform: scale(1.1);
  }

  /* Thiệp chúc */
  .card {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255, 192, 203, 0.95);
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    width: 80%;
    max-width: 400px;
    color: #ff4d88;
    box-shadow: 0 0 20px rgba(255, 105, 180, 0.8);
    animation: fadeIn 1s ease forwards;
  }

  @keyframes fadeIn {
    from {opacity: 0; transform: translate(-50%, -60%);}
    to {opacity: 1; transform: translate(-50%, -50%);}
  }

  .card h2 {
    margin-bottom: 10px;
    font-size: 26px;
  }
  .card p {
    font-size: 16px;
  }

  .hearts {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .heart {
    position: absolute;
    color: #ff99c8;
    animation: fall 3s linear infinite;
    opacity: 0.8;
  }

  @keyframes fall {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(100vh) scale(0.3); opacity: 0; }
  }

  #clickText {
    margin-top: 20px;
    color: #ffccff;
    font-size: 18px;
    animation: glow 1.5s ease-in-out infinite alternate;
  }
  @keyframes glow {
    from { text-shadow: 0 0 10px #ff99c8; }
    to { text-shadow: 0 0 20px #fff; }
  }
</style>
</head>
<body>
  <div class="stars"></div>
  <img src="https://cdn-icons-png.flaticon.com/512/7664/7664109.png" alt="rose" class="flower" id="rose">
  <p id="clickText">🌸 Click vào hoa để nhận lời chúc 💫</p>

  <div class="card" id="card">
    <h2>💖 Chúc mừng ngày 20/10 💖</h2>
    <p>Chúc Bông luôn xinh xắn, vui vẻ, mạnh khỏe, tỏa sáng như những vì sao trong vũ trụ này nhaaa ✨<br> 💐</p>
  </div>

  <div class="hearts" id="hearts"></div>

  <script>
    const rose = document.getElementById('rose');
    const card = document.getElementById('card');
    const clickText = document.getElementById('clickText');
    const hearts = document.getElementById('hearts');

    rose.addEventListener('click', () => {
      rose.style.display = 'none';
      clickText.style.display = 'none';
      card.style.display = 'block';

      // Hiệu ứng tim bay
      for (let i = 0; i < 30; i++) {
        let heart = document.createElement('div');
        heart.innerHTML = '💗';
        heart.classList.add('heart');
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.fontSize = Math.random() * 24 + 10 + 'px';
        heart.style.animationDuration = (2 + Math.random() * 3) + 's';
        hearts.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 3000);
      }
    });
  </script>
</body>
</html>
